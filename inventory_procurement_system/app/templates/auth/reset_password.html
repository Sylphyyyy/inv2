<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Reset Password | ARVEE • AYSCEE Enterprises</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-md rounded-xl bg-white p-8 shadow-xl">
    <h1 class="mb-2 text-2xl font-semibold">Choose a new password</h1>
    <p class="mb-6 text-sm text-slate-600">Use at least 12 characters for your new password.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-4 flex flex-col gap-2">
          {% for category, message in messages %}
            <div class="rounded p-3 text-sm {% if category == 'error' or category == 'danger' %}bg-red-100 text-red-900{% else %}bg-slate-100 text-slate-900{% endif %}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" class="flex flex-col gap-4">
      <div>
        <label class="mb-1 block text-sm font-medium" for="password">New password</label>
        <input class="w-full rounded border border-slate-300 px-3 py-2" id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium" for="confirm_password">Confirm new password</label>
        <input class="w-full rounded border border-slate-300 px-3 py-2" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      </div>
      <button class="w-full rounded bg-green-700 px-4 py-2.5 font-semibold text-white hover:bg-green-800" type="submit">Change password</button>
    </form>
  </main>
</body>
</html>
