{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-11">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white py-3">
                <h5 class="mb-0"><i class="bi bi-check-circle me-2"></i>Review Extracted Bid Requirements</h5>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('bid_upload.save_bids') }}" method="POST">
                    <div class="table-responsive">
                        <table class="table table-bordered align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th style="width: 7%;">Item No.</th>
                                    <th style="width: 20%;">Product Name</th>
                                    <th style="width: 33%;">Description</th>
                                    <th style="width: 10%;">Quantity</th>
                                    <th style="width: 10%;">Unit</th>
                                    <th style="width: 20%;">Budget (PHP)</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for item in items %}
                                <tr>
                                    <td>
                                        <input type="number" class="form-control" name="item_no[]" value="{{ item.item_no }}" readonly required>
                                    </td>
                                    <td>
                                        <input type="text" class="form-control" name="item_name[]" value="{{ item.item_name }}" required>
                                    </td>
                                    <td>
                                        <textarea class="form-control" name="description[]" rows="2" required>{{ item.description }}</textarea>
                                    </td>
                                    <td>
                                        <input type="number" class="form-control" name="quantity[]" value="{{ item.quantity }}" required>
                                    </td>
                                    <td>
                                        <input type="text" class="form-control" name="unit[]" value="{{ item.unit }}" required>
                                    </td>
                                    <td>
                                        <div class="input-group">
                                            <span class="input-group-text">₱</span>
                                            <input type="number" step="0.01" class="form-control" name="budget_php[]" value="{{ item.budget_php }}" required>
                                        </div>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                    <button type="submit" class="btn btn-success w-100 mt-3">
                        <i class="bi bi-save me-1"></i> Confirm and Save to Bid Request
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
