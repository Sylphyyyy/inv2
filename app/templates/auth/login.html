<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Portal Access | ARVEE • AYSCEE Enterprises</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <style>
    @layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface": "#f8f9ff", "on-surface": "#0b1c30", "surface-container-lowest": "#ffffff", "surface-container-low": "#eff4ff", "surface-container": "#e5eeff", "primary": "#006130", "on-primary": "#ffffff", "primary-container": "#107c41", "secondary": "#a83900", "tertiary": "#495468", "outline": "#6f7a6f", "error-container": "#ffdad6", "on-error-container": "#93000a", "on-surface-variant": "#3f4940" }, "spacing": { "space-xs": "0.25rem", "space-sm": "0.5rem", "space-md": "1rem", "space-lg": "1.5rem", "space-xl": "2rem", "margin-mobile": "1rem", "margin-desktop": "2.5rem", "gutter-lg": "2rem" }, "fontFamily": { "body-lg": ["Inter"], "body-md": ["Inter"], "body-sm": ["Inter"], "label-lg": ["Inter"], "label-md": ["Inter"], "label-sm": ["Inter"], "headline-lg": ["Inter"] } } } };
  </script>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
  <main class="w-full flex items-center justify-center">
    <div class="flex flex-col w-full items-center justify-center py-gutter-lg px-margin-mobile md:px-margin">
      <div class="w-full max-w-md bg-surface-container-lowest shadow-xl rounded-xl p-space-lg md:p-space-xl flex flex-col relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-primary via-primary-container to-secondary"></div>
        
        <div class="flex flex-col items-center text-center mt-space-sm mb-space-lg">
          <div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center text-primary-container shadow-sm mb-space-md">
            <span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">shield</span>
          </div>
          <h1 class="font-headline-lg text-2xl font-semibold text-on-surface">Login</h1>
        </div>

        <!-- Jinja2 Flash Messages converted to Tailwind -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="mb-4 flex flex-col gap-2">
              {% for category, message in messages %}
                <div class="p-3 rounded text-sm {% if category == 'error' or category == 'danger' %}bg-error-container text-on-error-container{% else %}bg-surface-container text-on-surface{% endif %}">
                  {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <!-- Form updated for backend POST submission -->
        <form method="POST" action="" class="flex flex-col space-y-space-md">
          <div class="flex flex-col">
            <label class="font-label-md text-xs font-semibold text-on-surface mb-1" for="username">Username </label>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-3 text-tertiary text-[20px] pointer-events-none">badge</span>
              <input autocomplete="username" class="w-full bg-surface-container-low text-on-surface font-body-md pl-10 pr-3 py-2.5 rounded outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all duration-150 placeholder:text-outline" id="username" name="username" placeholder="e.g. bac_sec_0192" required autofocus type="text">
            </div>
          </div>
          
          <div class="flex flex-col">
            <div class="flex items-center justify-between mb-1">
              <label class="font-label-md text-xs font-semibold text-on-surface" for="password">Password</label>
              <a class="font-label-sm text-[11px] font-bold text-primary-container hover:underline hover:text-primary transition-colors" href="#reset-request">Forgot Password?</a>
            </div>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute left-3 text-tertiary text-[20px] pointer-events-none">lock</span>
              <input autocomplete="current-password" class="w-full bg-surface-container-low text-on-surface font-body-md pl-10 pr-10 py-2.5 rounded outline-none focus:bg-surface-container-lowest focus:shadow-md transition-all duration-150 placeholder:text-outline" id="password" name="password" placeholder="••••••••••••" required type="password">
              <button aria-label="Toggle password visibility" class="absolute right-3 flex items-center justify-center text-tertiary hover:text-on-surface focus:outline-none" id="pwd-toggle" type="button">
                <span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
              </button>
            </div>
          </div>
          
          <div class="flex items-center justify-between pt-1">
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <input class="w-4 h-4 rounded bg-surface-container-low text-primary-container accent-primary-container cursor-pointer" id="remember-session" type="checkbox">
              <span class="font-body-sm text-sm text-on-surface-variant">Remember device for 8 hours</span>
            </label>
          </div>
          
          <div class="pt-2">
            <button class="w-full bg-primary-container hover:bg-primary text-on-primary text-sm font-semibold py-2.5 px-4 rounded flex items-center justify-center gap-2 shadow-sm hover:shadow transition-all duration-150" type="submit">
              <span>Login</span>
              <span class="material-symbols-outlined text-[20px]">login</span>
            </button>
          </div>
        </form>

    

    <script>
      (function() {
        const pwdInput = document.getElementById('password');
        const toggleBtn = document.getElementById('pwd-toggle');
        const toggleIcon = document.getElementById('pwd-icon');

        if (toggleBtn && pwdInput && toggleIcon) {
          toggleBtn.addEventListener('click', function() {
            const isPassword = pwdInput.getAttribute('type') === 'password';
            pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
          });
        }
      })();
    </script>
  </main>
</body>
</html>
